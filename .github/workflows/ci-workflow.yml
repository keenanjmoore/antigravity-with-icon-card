name: Antigravity Card CI & Performance Benchmark

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type Check & Lint
        run: npm run check || npx tsc --noEmit

      - name: Build Antigravity Cards
        run: npm run build

      - name: Verify Distribution Assets
        run: |
          ls -lh dist/
          test -f dist/antigravity-card.js
